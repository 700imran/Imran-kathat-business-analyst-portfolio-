<text x="87.5" y="145.5" font-size="10" text-anchor="middle" fill="#222">Revenue(y) =</text>
<text x="87.5" y="157.5" font-size="10" text-anchor="middle" fill="#222">revenue x (1+g)^y</text>
<rect x="170" y="110" width="135" height="76" rx="8" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="1.3"/>
<text x="237.5" y="139.5" font-size="10" text-anchor="middle" fill="#222">COGS, Opex,</text>
<text x="237.5" y="151.5" font-size="10" text-anchor="middle" fill="#222">Depreciation as %</text>
<text x="237.5" y="163.5" font-size="10" text-anchor="middle" fill="#222">of revenue</text>
<rect x="320" y="110" width="135" height="76" rx="8" fill="#D5E8D4" stroke="#82B366" stroke-width="1.3"/>
<text x="387.5" y="145.5" font-size="10" text-anchor="middle" fill="#222">EBIT = Revenue - COGS</text>
<text x="387.5" y="157.5" font-size="10" text-anchor="middle" fill="#222">- Opex - Depreciation</text>
<rect x="470" y="110" width="135" height="76" rx="8" fill="#D5E8D4" stroke="#82B366" stroke-width="1.3"/>
<text x="537.5" y="145.5" font-size="10" text-anchor="middle" fill="#222">Net income =</text>
<text x="537.5" y="157.5" font-size="10" text-anchor="middle" fill="#222">EBIT x (1 - tax)</text>
<rect x="620" y="110" width="135" height="76" rx="8" fill="#F8CECC" stroke="#B85450" stroke-width="1.3"/>
<text x="687.5" y="145.5" font-size="10" text-anchor="middle" fill="#222">FCF = Net income + Dep</text>
<text x="687.5" y="157.5" font-size="10" text-anchor="middle" fill="#222">- Capex - WC change*</text>
<rect x="770" y="110" width="135" height="76" rx="8" fill="#D5E8D4" stroke="#82B366" stroke-width="1.3"/>
<text x="837.5" y="145.5" font-size="10" text-anchor="middle" fill="#222">Discounted FCF =</text>
<text x="837.5" y="157.5" font-size="10" text-anchor="middle" fill="#222">FCF / (1+r)^y</text>
<rect x="920" y="110" width="135" height="76" rx="8" fill="#D5E8D4" stroke="#82B366" stroke-width="1.3"/>
<text x="987.5" y="145.5" font-size="10" text-anchor="middle" fill="#222">Terminal value =</text>
<text x="987.5" y="157.5" font-size="10" text-anchor="middle" fill="#222">FCF5 x (1+tg)/(r - tg)</text>
<rect x="1070" y="110" width="135" height="76" rx="8" fill="#D5E8D4" stroke="#82B366" stroke-width="1.3"/>
<text x="1137.5" y="139.5" font-size="10" text-anchor="middle" fill="#222">Enterprise value =</text>
<text x="1137.5" y="151.5" font-size="10" text-anchor="middle" fill="#222">sum(disc. FCF) +</text>
<text x="1137.5" y="163.5" font-size="10" text-anchor="middle" fill="#222">disc. terminal value</text>
<rect x="20" y="230" width="760" height="52" fill="#FFFFFF" stroke="#999999" stroke-width="1.3"/>
<text x="400.0" y="253.5" font-size="10" text-anchor="middle" fill="#222">* WC change is computed as revenue x WC % (a level, not a year-on-year change): finding F-08.</text>
